# 标定板定义
#
# ⚠️ marker_length 和 marker_separation 必须填**实测值**，不是设计值。
#    家用打印机有缩放（A4 出图再打印，实物一定比图上小）。
#    而尺度误差会**原样**变成位置误差 —— 板子偏几个百分点，解出来的距离就偏几个百分点。
#
# ★ 量法：量**整个 3×3 阵列的外圈宽 W**（左列 marker 黑边 → 右列 marker 黑边），
#   **不要量单个 marker**。两个量法的精度差在这儿：
#
#       量整张板的长基线  → 读数误差摊到 L 上要除一个大的系数
#       量单个 marker     → 读数误差**原样**落到 L 上
#
#   ⇒ 同样的尺子和手，量外圈宽得到的 L 精度高一个数量级。
#     这是「起先量单个 marker、结果偏了好几个百分点」那次的教训。
#
#       3:1 的间距比决定了系数：
#
#       marker_length = 3W/11        （W = 整张板外圈宽）
#
# ⚠️ 那一次踩的坑：量单个 marker 得到一个偏小好几个百分点的值，用了很久；
#    后来量外圈宽才发现。而板子尺度偏多少，`fx` 就跟着偏多少，
#    最后表现为「规格书的视场角看起来是错的」—— 其实是板子的数错了。
#
# ★ 两套 ID 的打印图（`aruco_board_A4.png` / `aruco_board_A4_ID9.png`）统一按
#   **设计值**出图（marker 30 mm / 间隙 10 mm，板宽 110 mm）。
#   ⚠️ 但 A4 打印有缩放，**实物实测值要自己量**。
#   ⇒ 下面两个数填的是**实物实测值**，不是打印图上的设计值。
#   ⚠️ 换板子 / 重印后必须重新量再回填 —— 拿图上的设计值来填就是尺度的错，
#      而且**不会报任何错**，只是所有距离静默地按比例偏。

board:
  dictionary: DICT_4X4_50

  #: ★ 当前形态：**3×3 板**（整张标定板），所以是 3×3。
  #:   （之前部署时换成的是单个 marker；现在换回来了。）
  #:
  #:   ✅ 两种形态都支持 —— 几何是配置驱动的，代码里没有写死的形状。
  #:     换板子**只改这一个文件**：markers_x / markers_y / marker_length /
  #:     marker_separation / first_marker_id / accepted_ids。
  #:     "至少解出几个 marker"那个门槛会自动跟着这里走
  #:     （min_markers=0 = 跟随：按板子上的 marker 总数自动算一个门槛），
  #:     不用你去记第二处。
  #:
  #:   ★★ 3×3 时**板系原点 = 正中间那个 marker（ID 4）的中心**。
  #:      奇数行列时 marker_centre(1,1) 恰好等于 [0,0,0]，已验证。
  #:      所以下面 targets 里的 tip_in_board 就是"按键中心相对**中心码**中心"，
  #:      和你手量的方向完全一致，**不用再换算一次**。
  #:      （这个 ID 4 就是之前单独贴在电梯旁边的那个码 —— 它就是中心码，
  #:       所以换板子没有改变 tip_in_board 的含义。）
  #:
  #:   ⚠️ 1×1 时同样成立：那时原点就是那个唯一码的中心。两种形态下
  #:      "相对原点量偏移"这句话都成立，所以 tip_in_board 不用改。
  markers_x: 3
  markers_y: 3

  #: 每个 marker 的边长（含黑色边框），米。★ **实物的实测值**
  #: 量**黑边的外沿**，不是里面白色方块的边长 —— 差一圈边框就是几个百分点。
  #: ⚠️ 这个值只影响解出来的**距离**：填大了，报的距离就偏远。
  #:    验证方法：量一下相机到板子的实际距离，对不上就是这里填错了。
  #: ⚠️⚠️ **不要填打印图上的设计值。** A4 打印有缩放，实物一定比图上小。
  #:    打印缩放是**系统性**的，所以两套 ID 的板子打出来一样大、共用这一个值。
  #:    换板子 / 重印后必须重新量，不要照抄图上的设计值。
  marker_length: 0.0285

  #: 相邻 marker 的空隙，米。3×3 时**不能是 0** —— 它是板心尺度的另一半。
  #: ★ **实物的实测值。** 量法：量整张板子外圈宽 W，则 S = (W − 3L)/2。
  #:   同样**不要填图上的设计值**。
  #: ⚠️ 它和 marker_length 的**比例**决定几何形状，量错一个就是一块"形状不对
  #:    的板子"，`solvePnP` 会给一个自洽但偏的位姿。
  marker_separation: 0.0095

  #: ★★ 起始 ID，**必须和实物一致**。
  #:    写错了不是"稍微偏"，是**直接找不到** —— 检测器是按 ID 过滤的，
  #:    日志只会出现 `not publishing: no board (need N markers)`，
  #:    读起来像相机没拍到，实际是拍到了、ID 对不上。
  #:    不知道 ID：跑 tools/find_marker_id.py --image aruco_board_A4.png
  #:    （实测读出来就是 0，中心码是 4）。
  first_marker_id: 0

  #: 只认这些 ID。3×3 就是九个全要 —— 白名单窄一点，误检就少一点。
  #: ⚠️ 这里列出的**个数**决定了检测器实际在找几个码：漏一个就一直解不出位姿。
  accepted_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# ── 在 3×3 板 和 单个 marker 之间切换 ─────────────────────────────
#   只改上面那一块，几处要一起改。少改一处就是**隐性尺度错误**：
#   它不会报错，只会让所有距离按比例偏。
#
#     形态        markers_x/y  marker_length  marker_separation   accepted_ids
#     3×3 标定板    3 / 3       实测边长       实测空隙（≈0.0095）  [0..8]
#     单个 marker   1 / 1       实测边长       0.0                 [那一个 ID]
#
#   ✅ 感知节点的 `min_markers` **不用改**：默认 0 = 跟随这里。
#      写死一个数是第二处真相，两处不一致时的表现很有欺骗性 ——
#      单个 marker 配 6，日志永远打 `no board (need 6 markers)`，
#      看着像**相机没拍到**，实际是门槛比板子上的码还多。
#
#   ⚠️ 单个 marker 没有冗余：3×3 靠"解出了几个 marker"能发现坏情况
#      （实测贴反时 9 个只剩 1 个能解码，数量就是那个信号），
#      单个只剩"检出 / 没检出"一个信号。所以它要贴得够大、够正、离得够近。
#
#   ★ **实测记录**（2026-09 前后，具体日期未记）：位姿峰峰抖动 ——
#         3×3 整板         0.3 ~ 1.3 mm
#         单个 28.5 mm 码   2.3 ~ 3.3 mm
#     ⚠️ **那次没记录测距**，所以不能直接当"单码差 5 倍"用 ——
#        位置误差大致随距离线性下降，近距离的单码未必输。
#        这是 2026-10-14 讨论"第二次观测用单码还是整板"时唯一的实测依据。
#
#   ⚠️ 切回 3×3 之后第一件事是**重新量 tip_in_board**：那套 3×3 的板系原点是
#      板心，按键相对**板心**的偏移和相对**单码中心**的偏移不是一回事。
#      忘了改就会按到另一个地方去 —— 而且同样不会报错。

# ── 板系约定（不要改，代码里钉死了）─────────────────────────────────
#   原点 = 板子几何中心
#   +X  向右（面向板子看）
#   +Y  向上
#   +Z  垂直板面向外，指向观察者
#
#   ⇒ 板子贴在竖直面板上、正对机械臂时，板系 −Z 就是"往面板里压"的方向。
#   ⇒ 板子贴反了会差 180°，但四元数看起来仍然"正常" —— 要靠验证步骤抓。
#
# ── 板子总尺寸 ────────────────────────────────────────────────────
#   由上面三个几何参数算出来：
#       宽 = markers_x·L + (markers_x − 1)·S      高同理
#   打印图上的设计值与实物实测值差的，就是 A4 打印的缩放。
#   ⚠️ 不在这里写具体毫米数 —— 它随上面三个值变。


# ══════════════════════════════════════════════════════════════════════
#  精修正板（第二次观测）—— 单个码
# ══════════════════════════════════════════════════════════════════════
#
# 用途：臂停在**接近位姿**（pre_press）时再拍一次，用近距离的观测去修正
# 远处整张板给出的粗目标。任务侧只融合**位置**，法向仍用第一次的。
#
# ⚠️ 为什么是**单个**码，不是第二块整板：
#    接近位姿下相机离面板只有十几厘米，整张板根本进不了画面（纵向视场撑不下）；
#    单个码在那个距离上还有约一百像素，够用。代价见下面的"没有冗余"。
#
# ⚠️ 不需要这块板时（或只想跑单板）**整段删掉**即可 —— 代码里 refine_board
#    是可选节，缺了就是单板部署。这是受支持的形态，不是特例。
refine_board:
  dictionary: DICT_4X4_50

  #: 单码形态：1×1、没有间隔。换回整板只改这一块。
  markers_x: 1
  markers_y: 1
  marker_separation: 0.0

  #: ★ 实物实测值，量法同上面那块（量外圈宽反推，不要量单个 marker）。
  #: ⚠️ 两块板各自存一份几何是**故意**的：哪天只重印了其中一块、或换了一台
  #:    打印机，只改一处的代价是那块板的所有距离**静默地**按比例偏。
  marker_length: 0.0285

  #: 单个码的 ID。
  first_marker_id: 9
  accepted_ids: [9]

  #: 这块板的位姿发到哪个话题。
  #: ⚠️⚠️ 和粗目标那条链路**完全分开** —— 写成"谁先解出就发谁"会把粗板的位置
  #:      发到精修正话题上，而日志 / RMS / marker 数**全部正常**，没人看得出来。
  #:      所以两个话题各有一个独立发布者，代码里没有让它们合流的路径。
  pose_topic: /perception/refine_board_pose

  #: ⚠️ 单个码**没有冗余**：整张板靠"解出了几个 marker"能发现坏情况（实测贴反时
  #:    九个只剩一个能解码，数量就是那个信号），单个只剩"检出 / 没检出"。
  #:    而那一个码足够让 solvePnP 拟合出**朝前、指向正确、重投影 RMS 只有零点几
  #:    像素**的位姿 —— 而且是错的。
  #:    ⇒ 错的位姿和对的位姿**长得一模一样**。兜底只有三条：
  #:      ① 任务侧的修正量闸门（离粗目标太远就整个拒绝）
  #:      ② 法向不参与融合（单码不碰方向）
  #:      ③ 贴完码**人眼**看一次画了坐标轴的 debug 图
  #:    第 ③ 条没法自动化，别省。

  #: ⚠️ 这个块只管【码本身】：几何 + 位姿发到哪个话题。
  #:    码中心 → 按键的偏移记在下面 `targets.<名字>.refine_tip_in_board` ——
  #:    那是「按键在哪」，跟按键的名字走，不跟板子走。

# ══════════════════════════════════════════════════════════════════════
#  板子 → 电梯按键 的固定关系
# ══════════════════════════════════════════════════════════════════════
#
# 部署形态：ArUco 码贴在**电梯按键旁边的固定位置**。识别出板子之后，用下面这个
# 固定变换算出**按键**在哪 —— 要按的是按键，不是 ArUco 本身。
#
# ⚠️ 前提：板子和按键**刚性固定**在同一块面板上。板子挪了、按键换了，这里全部作废，
#    必须重新量。实测按压本身就能让板子移位（靠在泡沫上的那种），
#    所以量完之后**压几次要复核一遍**。
#
# ── 板系怎么定（不要改，代码里钉死了）────────────────────────────────
#
#     原点 = 板心
#     +X  向右（面向板子看）
#     +Y  向上
#     +Z  垂直板面向外，指向你（观察者）
#
#   ⇒ 所以"往板面里压" = 板系的 **−Z**。
#     这就是下面默认轴 (0, 0, -1) 的来历，不是随便填的。
#   ⇒ 板子贴反了会差 180°，而四元数看起来仍然"正常" —— 只能靠实测抓。
#
# ── 三个字段 ────────────────────────────────────────────────────────
#
#   tip_in_board
#       杆尖**应该落到的那个点**在板系里的位置。也就是按键中心。
#       不是板心、不是面板平面、不是末端法兰。
#
#       ⚠️ **单位是米，全部三个分量都是米。** 不是毫米。
#          用毫米量的直接 ÷1000：80 mm → 0.080， 25 mm → 0.025。
#          （整个工程都是米的 SI 习惯，日志里才印毫米。）
#
#       量法：从板心沿 +X 量 dx、沿 +Y 量 dy。dz 一般留 0（按键和板子共面）；
#       只有按键明显凹进去/凸出来才需要给。
#
#   press_axis_in_board
#       按压方向，板系**单位向量**，指向按键内部。
#       默认 (0, 0, -1) = 垂直板面压进去 —— 按键行程轴和面板法线一致时就用它，
#       这也是最常见的情况，**只有位移关系时这里不用动**。
#       只有按键凸起、或面板斜装时才需要改：那种情况斜着压会把按键别住。
#
#       ⚠️ 绕按压轴的**自转不在这里**，也不需要：手臂是 5 自由度的，joint6 不参与，
#          绕杆自转本来就是自由的，写进来也没人执行。
#
#   taught
#       这条是不是量过的。false 时入口脚本会**直接拒绝**，不会拿占位坐标去压 ——
#       用编造的数字按压 = 命令机械臂去一个没人知道的地方。
#
# ── 怎么填（四步）──────────────────────────────────────────────────
#
#   1) 量：从板心到按键中心，量 dx / dy（用毫米量就行）
#   2) 填进下面的 tip_in_board，**记得换成米**（80 mm 写成 0.080）
#   3) 把 taught 改成 true
#   4) 先干跑，对着尺子核一遍：
#          cd /ws && tools/demo.sh --button call
#      它会打印"需要移动"多少毫米 —— 和实测距离对上了再 --live
#
#   ⚠️ tip_in_board 写成 0,0,0 就是**板心本身**，不是"按到按键"。
#      它是个合法值，所以不会报错，只会按到板子中间去。
#
#   ★ 偏移量是**放大倍数**：任何角度误差都会在这个杆臂上被放大。
#     放大倍数≈ |tip_in_board| —— 它越长，同样的板子转角误差造成的落点横偏越大。
#     （想估当前值：取上面那个偏移的模长，乘以 1° 的弧度值即可。）
#     ⇒ 板子能贴得离按键近一点，就贴近一点。
#
#     这正是用整张 3×3 板、而不是单个小码的价值：板子自己解出的姿态稳得多
#     （实测抖动比单个小码小一个量级），把角度误差这一项从源头压下去。

targets:
  call:                      # 名字随便起，命令行用 --button <名字> 指定
    taught: true             # ← 量完改成 true
    # ⚠️ 三个分量都是**米**。毫米量的先 ÷1000。
    #    ★ 下面是**实测值**：按键相对**中心码中心**的偏移，板系、米。
    #      （3×3 时"中心码"就是板系原点，见上面 markers_x 那段。）
    #    ⚠️ **不要把量出来的毫米数写进注释** —— 它改一次这里就对不上一次
    #       （历史上就发生过：注释写着一个值、字段里是另一个值，谁都没发现）。
    #       数值只看冒号后面那个。
    #    ⚠️ 2026-10-14 换了新板位，重新量过。
    #       ⚠️⚠️ **尺子只给数值，符号必须抬头看实物。** 这次差点填反：
    #          量到的横向距离是 17.5 cm，但**面向板子看，按键在板心的左上方**，
    #          所以 x 是**负**的，不是正的。
    #          （板子若转着贴或贴反，符号会整体翻 —— 只能靠眼睛，代码看不出来。）
    #       板系约定：+X 右、+Y 上 —— 都是**面向板子看**时的方向。
    tip_in_board: {x: -0.175, y: 0.260, z: 0.000}
    press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}   # 单位向量，无单位

    # ── 同一个按键，从**精修正那个单码**看过去 ──────────────────────
    # 码中心 → 按键中心，板系、米。量法同上面一条。
    # 两条量的是同一个物理按键，只是基准码不同，所以并排放这里。
    # ⚠️ 尺子只给数值，**符号必须抬头看实物**。填错轴/填错号时修正量会明显
    #    超过任务侧的闸门 → 被拒绝并打日志，而不是按到错的地方去。
    refine_tip_in_board: {x: 0.000, y: -0.045, z: 0.000}
    # 量完改成 true。false 时精修正通道整条被拦住，任务侧走降级路径——
    # 这正是设计要的"视觉是增益，不是依赖"。
    refine_taught: true

  # 需要多个按键就照抄一段改名，例如：
  # up:
  #   taught: false
  #   tip_in_board: {x: 0.000, y: 0.080, z: 0.000}
  #   press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}
