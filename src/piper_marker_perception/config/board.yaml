# 标定板定义
#
# ⚠️ marker_length 和 marker_separation 必须填**实测值**，不是设计值。
#    家用打印机缩个 5% 很常见 —— 110 mm 的板子印成 104.5 mm。
#    而 1% 的尺度误差会原样变成 1% 的位置误差（在 0.4 m 处就是 4 mm）。
#
# ★ 量法：量**整个 3×3 阵列的外圈宽 W**（左列 marker 黑边 → 右列 marker 黑边），
#   **不要量单个 marker**。因为 27:9 和 30:10 都等于 3:1，所以 W = 11L/3：
#
#       marker_length = 3W/11
#
#   量 105 mm 基线读到 ±0.5 mm ⇒ L 只差 ±0.14 mm（±0.5%）；
#   而量单个 28 mm marker 同样读 ±0.5 mm ⇒ ±1.8%。**差 4 倍。**
#
# ⚠️ 这一条踩过坑：起先按「单个 marker 27 mm」用了很久，后来量外圈宽
#    得到 105 mm 才发现 27 是错的 —— 真值是 28.5/9.5，整整偏了 5.6%。
#    而 5.6% 的板子误差会把 fx 带偏 5.6%，进而把规格书看起来“错了 16%”。

board:
  dictionary: DICT_4X4_50

  #: 板子是 markers_x × markers_y 个 marker 的栅格
  markers_x: 3
  markers_y: 3

  #: 单个 marker 的边长（含黑色边框），米。★ 实测
  #: 这是打印机缩到 ~95% 打出来的那张。钢尺实测 marker 28.5 mm、
  #: 间隔 9.5 mm，验算外圈宽 = 3×28.5 + 2×9.5 = 104.5 mm，
  #: 与另一次独立量到的 105 mm 一致。
  #: ⚠️ 这个值只影响解出来的**距离**：填大了，报的距离就偏远。
  #:    验证方法：量一下相机到板子的实际距离，对不上就是这里填错了。
  marker_length: 0.0285

  #: 相邻两个 marker 之间的**空隙**，不是中心距，米。★ 实测
  #: 中心距 = marker_length + marker_separation = 38 mm
  marker_separation: 0.0095

  #: 栅格左上角那个 marker 的 ID，其余按 从左到右、从上到下 递增
  first_marker_id: 0

  #: 只认这些 ID。场景里出现别的 marker（或恰好长得像的图案）一律忽略。
  accepted_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# ── 板系约定（不要改，代码里钉死了）─────────────────────────────────
#   原点 = 板子几何中心
#   +X  向右（面向板子看）
#   +Y  向上
#   +Z  垂直板面向外，指向观察者
#
#   ⇒ 板子贴在竖直面板上、正对机械臂时，板系 −Z 就是"往面板里压"的方向。
#   ⇒ 板子贴反了会差 180°，但四元数看起来仍然"正常" —— 要靠验证步骤抓。
#
# ── 板子总尺寸 ────────────────────────────────────────────────────
#   宽 = 3×28.5 + 2×9.5 = 104.5 mm
#   高 = 3×28.5 + 2×9.5 = 104.5 mm
#   （按设计值 30/10 打的话是 110×110 mm）


# ══════════════════════════════════════════════════════════════════════
#  板子 → 按键 的固定关系
# ══════════════════════════════════════════════════════════════════════
#
# ⚠️ 前提：板子和按键**刚性固定**在同一块面板上。板子挪了、按键换了，
#    这里全部作废，必须重新教示。
#
# 坐标系：板系（原点板心，+X 右，+Y 上，+Z 垂直板面向外）
#
#   tip_in_board
#       杆尖**应该落到的点**在板系下的位置，米。也就是按键中心那个点。
#       不是板心、不是面板平面、不是末端法兰。
#
#   press_axis_in_board
#       按压方向在板系下的单位向量。指向**按键内部**。
#       默认 (0, 0, -1) = 垂直板面压进去，适用于板子和按键共面的常见情况。
#       只有按键的行程轴和面板法线不一致时才需要改。
#
# ⚠️⚠️ 下面全是**占位值**，不是测量值。上实机前必须用教示脚本测一遍：
#
#         ros2 run piper_marker_perception teach_press_offset.py --name red
#
#     桥节点会**拒绝发布** taught: false 的目标，所以忘不了。
#     用编造的数字去按压 = 机械臂按到不知道哪里的地方。

targets:
  red:
    taught: false            # ← 教示后改成 true
    tip_in_board: {x: 0.000, y: 0.000, z: 0.000}
    press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}

  blue:
    taught: false
    #: 电梯面板上三个按键间距 80 mm（blue z=0.320 / red 0.240 / green 0.160），
    #: 下面假设板心对齐 red。真实值以教示结果为准。
    tip_in_board: {x: 0.000, y: 0.080, z: 0.000}
    press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}

  green:
    taught: false
    tip_in_board: {x: 0.000, y: -0.080, z: 0.000}
    press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}
