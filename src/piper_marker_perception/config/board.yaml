# 标定板定义
#
# ⚠️ marker_length 和 marker_separation 必须填**实测值**，不是设计值。
#    家用打印机有 ±1% 的缩放误差 —— 110 mm 的板子可能印成 109 或 111 mm，
#    1% 的尺度误差会原样变成 1% 的位置误差（在 0.4 m 处就是 4 mm）。
#
#    打印后拿卡尺量一个 marker 的边长，把量到的数填回来。
#    `make_board.py` 生成的图上带一根 100.0 mm 的标准刻度线，先用它粗检。

board:
  dictionary: DICT_4X4_50

  #: 板子是 markers_x × markers_y 个 marker 的栅格
  markers_x: 3
  markers_y: 3

  #: 单个 marker 的边长（含黑色边框），米。★ 实测
  marker_length: 0.030

  #: 相邻两个 marker 之间的**空隙**，不是中心距，米。★ 实测
  #: 中心距 = marker_length + marker_separation = 40 mm
  marker_separation: 0.010

  #: 栅格左上角那个 marker 的 ID，其余按 从左到右、从上到下 递增
  first_marker_id: 0

  #: 只认这些 ID。场景里出现别的 marker（或恰好长得像的图案）一律忽略。
  accepted_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# ── 板系约定（不要改，代码里钉死了）─────────────────────────────────
#   原点 = 板子几何中心
#   +X  向右（面向板子看）
#   +Y  向上
#   +Z  垂直板面向外，指向观察者
#
#   ⇒ 板子贴在竖直面板上、正对机械臂时，板系 −Z 就是"往面板里压"的方向。
#   ⇒ 板子贴反了会差 180°，但四元数看起来仍然"正常" —— 要靠验证步骤抓。
#
# ── 板子总尺寸 ────────────────────────────────────────────────────
#   宽 = 3×30 + 2×10 = 110 mm
#   高 = 3×30 + 2×10 = 110 mm
