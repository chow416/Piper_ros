# 标定板定义
#
# ⚠️ marker_length 和 marker_separation 必须填**实测值**，不是设计值。
#    家用打印机缩个 5% 很常见 —— 110 mm 的板子印成 104.5 mm。
#    而 1% 的尺度误差会原样变成 1% 的位置误差（在 0.4 m 处就是 4 mm）。
#
# ★ 量法：量**整个 3×3 阵列的外圈宽 W**（左列 marker 黑边 → 右列 marker 黑边），
#   **不要量单个 marker**。因为 27:9 和 30:10 都等于 3:1，所以 W = 11L/3：
#
#       marker_length = 3W/11
#
#   量 105 mm 基线读到 ±0.5 mm ⇒ L 只差 ±0.14 mm（±0.5%）；
#   而量单个 28 mm marker 同样读 ±0.5 mm ⇒ ±1.8%。**差 4 倍。**
#
# ⚠️ 这一条踩过坑：起先按「单个 marker 27 mm」用了很久，后来量外圈宽
#    得到 105 mm 才发现 27 是错的 —— 真值是 28.5/9.5，整整偏了 5.6%。
#    而 5.6% 的板子误差会把 fx 带偏 5.6%，进而把规格书看起来“错了 16%”。

board:
  dictionary: DICT_4X4_50

  #: 板子是 markers_x × markers_y 个 marker 的栅格
  markers_x: 3
  markers_y: 3

  #: 单个 marker 的边长（含黑色边框），米。★ 实测
  #: 这是打印机缩到 ~95% 打出来的那张。钢尺实测 marker 28.5 mm、
  #: 间隔 9.5 mm，验算外圈宽 = 3×28.5 + 2×9.5 = 104.5 mm，
  #: 与另一次独立量到的 105 mm 一致。
  #: ⚠️ 这个值只影响解出来的**距离**：填大了，报的距离就偏远。
  #:    验证方法：量一下相机到板子的实际距离，对不上就是这里填错了。
  marker_length: 0.0285

  #: 相邻两个 marker 之间的**空隙**，不是中心距，米。★ 实测
  #: 中心距 = marker_length + marker_separation = 38 mm
  marker_separation: 0.0095

  #: 栅格左上角那个 marker 的 ID，其余按 从左到右、从上到下 递增
  first_marker_id: 0

  #: 只认这些 ID。场景里出现别的 marker（或恰好长得像的图案）一律忽略。
  accepted_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# ⚠️ 上面这段描述的是**标定用的 3×3 板**。
#    如果部署时改用**一个小 marker** 贴在电梯按键旁边，下面几处必须一起改 ——
#    少改一处就是一个隐性尺度错误，而它不会报错，只会让所有距离按比例偏：
#
#      markers_x / markers_y   → 1 / 1
#      marker_length           → 那个小 marker 的**实测**边长（量黑边、含框）
#      accepted_ids            → 只留它那一个 ID
#
#    另外感知节点的 `min_markers` 默认是 6，单个 marker 必须降到 1：
#      ros2 run piper_marker_perception marker_locator.py --ros-args \
#          -p min_markers:=1
#
#    ⚠️ 降到 1 就没有冗余了：3×3 板靠"解出了几个 marker"能发现坏情况
#       （实测贴反时只剩 1 个能解码，数量就是那个信号），
#       单个 marker 只剩"检出 / 没检出"一个信号。所以它要贴得够大、够正、离得够近。

# ── 板系约定（不要改，代码里钉死了）─────────────────────────────────
#   原点 = 板子几何中心
#   +X  向右（面向板子看）
#   +Y  向上
#   +Z  垂直板面向外，指向观察者
#
#   ⇒ 板子贴在竖直面板上、正对机械臂时，板系 −Z 就是"往面板里压"的方向。
#   ⇒ 板子贴反了会差 180°，但四元数看起来仍然"正常" —— 要靠验证步骤抓。
#
# ── 板子总尺寸 ────────────────────────────────────────────────────
#   宽 = 3×28.5 + 2×9.5 = 104.5 mm
#   高 = 3×28.5 + 2×9.5 = 104.5 mm
#   （按设计值 30/10 打的话是 110×110 mm）


# ══════════════════════════════════════════════════════════════════════
#  板子 → 电梯按键 的固定关系
# ══════════════════════════════════════════════════════════════════════
#
# 部署形态：ArUco 码贴在**电梯按键旁边的固定位置**。识别出板子之后，用下面这个
# 固定变换算出**按键**在哪 —— 要按的是按键，不是 ArUco 本身。
#
# ⚠️ 前提：板子和按键**刚性固定**在同一块面板上。板子挪了、按键换了，这里全部作废，
#    必须重新量。实测按压本身就能让板子移位（靠在泡沫上的那种），
#    所以量完之后**压几次要复核一遍**。
#
# ── 板系怎么定（不要改，代码里钉死了）────────────────────────────────
#
#     原点 = 板心
#     +X  向右（面向板子看）
#     +Y  向上
#     +Z  垂直板面向外，指向你（观察者）
#
#   ⇒ 所以"往板面里压" = 板系的 **−Z**。
#     这就是下面默认轴 (0, 0, -1) 的来历，不是随便填的。
#   ⇒ 板子贴反了会差 180°，而四元数看起来仍然"正常" —— 只能靠实测抓。
#
# ── 三个字段 ────────────────────────────────────────────────────────
#
#   tip_in_board
#       杆尖**应该落到的那个点**在板系里的位置，**米**。也就是按键中心。
#       不是板心、不是面板平面、不是末端法兰。
#
#       量法：从板心沿 +X 量 dx、沿 +Y 量 dy。dz 一般留 0（按键和板子共面）；
#       只有按键明显凹进去/凸出来才需要给。
#
#   press_axis_in_board
#       按压方向，板系**单位向量**，指向按键内部。
#       默认 (0, 0, -1) = 垂直板面压进去 —— 按键行程轴和面板法线一致时就用它，
#       这也是最常见的情况，**只有位移关系时这里不用动**。
#       只有按键凸起、或面板斜装时才需要改：那种情况斜着压会把按键别住。
#
#       ⚠️ 绕按压轴的**自转不在这里**，也不需要：手臂是 5 自由度的，joint6 不参与，
#          绕杆自转本来就是自由的，写进来也没人执行。
#
#   taught
#       这条是不是量过的。false 时入口脚本会**直接拒绝**，不会拿占位坐标去压 ——
#       用编造的数字按压 = 命令机械臂去一个没人知道的地方。
#
# ── 怎么填（四步）──────────────────────────────────────────────────
#
#   1) 量：从板心到按键中心，量 dx / dy（用毫米量也行，填的时候换成米）
#   2) 填进下面的 tip_in_board
#   3) 把 taught 改成 true
#   4) 先干跑，对着尺子核一遍：
#          cd /ws && tools/demo.sh --button call
#      它会打印"需要移动"多少毫米 —— 和实测距离对上了再 --live
#
# ⚠️ 下面的值是**占位值**（板心），不是测量值。

targets:
  call:                      # 名字随便起，命令行用 --button <名字> 指定
    taught: false            # ← 量完改成 true
    tip_in_board: {x: 0.000, y: 0.000, z: 0.000}
    press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}

  # 需要多个按键就照抄一段改名，例如：
  # up:
  #   taught: false
  #   tip_in_board: {x: 0.000, y: 0.080, z: 0.000}
  #   press_axis_in_board: {x: 0.0, y: 0.0, z: -1.0}
