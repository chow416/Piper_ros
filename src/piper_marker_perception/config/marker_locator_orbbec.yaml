# marker_locator 参数 —— Orbbec DaBai DCW2（腕部正式相机）
#
#     ros2 run piper_marker_perception marker_locator.py \
#         --ros-args --params-file <包>/config/marker_locator_orbbec.yaml
#
# 换相机时只改三处：设备匹配名、分辨率、内参文件。
# 这就是“换相机不用改代码”的全部内容。

marker_locator:
  ros__parameters:
    device: "/dev/video2"
    device_hint: "orbbec,dabai,sonix"

    # ⚠️ 深度相机不在这里 —— 它的深度传感器不是 UVC 设备，要 Orbbec SDK。
    # 这里用的只是 RGB，走标准 UVC。

    # ⚠️ 640×480，因为同事的内参就是在 640×480 上标的。
    #    内参只在测它的那个分辨率上成立，而**这个相机的两种分辨率很可能
    #    不覆盖同一视场**（实测过，按比例换算会偏 15% ——
    #    所以这里不换算，直接用标定的那个分辨率）。
    #
    #    顺带一个旁证：640×480 的正交视场 53.4° 和 1920×1080 标称的
    #    54.0° 几乎相同，而水平从 84.3° 缩到 67.7° —— 正是 4:3 裁切
    #    16:9 传感器该有的样子。所以这一档是“保垂直、裁水平”。
    width: 640
    height: 480
    fps: 30

    camera_info: "config/camera_info_orbbec_640x480.yaml"

    # ★ 0 = **自动跟随 board.yaml**（推荐，别改成写死的数）。
    #   自动值 = 板子上 marker 总数的 60% 向上取整：3×3 → 6，单个 → 1。
    #
    #   板子形状已经在 board.yaml 里描述过一次了，这里再写一个数就是第二处真相，
    #   而两处不一致时的表现很有欺骗性：单个 marker 配 6，日志永远打
    #   `no board (need 6 markers)`，看着像**相机没拍到**，实际是门槛比实物还多。
    #
    #   为什么这个门值得认真定：它是**唯一能发现板子贴反的信号** ——
    #   实测 3×3 贴反时 9 个 marker 只剩 1 个能解码，而剩下的那 1 个足够
    #   solvePnP 拟合出一个重投影只有 0.14 px 的**错误**位姿，任何朝向检验都拆穿不了。
    #   门太靠近总数（如 9），坏一个 marker 就把好板子挡了；
    #   门太低（如 1），贴反就混过去了。
    min_markers: 0
    max_reproj_px: 2.0
    min_distance_m: 0.15
    max_distance_m: 1.5

    process_rate_hz: 5.0
    debug_rate_hz: 2.0

    # 需要机械臂系下的位姿时取消注释（要 TF + 手眼标定 + /joint_states）：
    # target_frame: "base_link"

    # 相机帧名必须和 URDF 里一致，否则查不到 TF
    # camera_frame: "wrist_depth_camera_optical_frame"
