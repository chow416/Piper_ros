# marker_locator 参数 —— Logitech C270（桌面测试用）
#
#     ros2 run piper_marker_perception marker_locator.py \
#         --ros-args --params-file <包>/config/marker_locator_c270.yaml
#
# 换回腕部相机时用 marker_locator_orbbec.yaml，**代码一行都不用改**。
# 相机的全部差异就是这三个数：设备、分辨率、内参文件。

marker_locator:
  ros__parameters:
    # 设备：先试这个路径，不存在就按 device_hint 在 sysfs 里按名字找
    device: "/dev/video2"
    device_hint: "logitech,046d:0825"

    # C270 最高 1280×960。⚠️ 它做不到 1080p —— 填 1920×1080 会被
    # 静默协商降级到 1280×960，节点会读回来并告警，不会闷声算错。
    #
    # ⚠️ 用 1280×960 而不是 640×480，有一条实测理由：这个相机的两种分辨率
    #    **不覆盖同一视场**（1280×960 是 46.9°，640×480 只有 41.4°），
    #    所以那个「按比例换算内参」的便利在这里是错的，会偏 15%。
    #    两份内参因此各存一份，用哪个分辨率就配哪一份。
    #
    #    选 1280×960 的理由：板子像素尺寸大 1.74 倍（角点更准），视场也更宽
    #    （手眼采集时摆姿态的自由度更大）。实测读出 0.6008 m / 真值 0.600 m。
    width: 1280
    height: 960
    fps: 30

    # 实测反推的内参（fx=1477.0 @1280×960），不是标定。推导和验证见文件头。
    # 要跑 640×480 就配 camera_info_c270_nominal.yaml（fx=847.5），别混用。
    camera_info: "config/camera_info_c270_1280x960.yaml"

    min_markers: 6
    max_reproj_px: 3.0
    min_distance_m: 0.15
    max_distance_m: 1.5

    process_rate_hz: 5.0
    debug_rate_hz: 2.0
