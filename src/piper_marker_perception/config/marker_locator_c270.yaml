# marker_locator 参数 —— Logitech C270（桌面测试用）
#
#     ros2 run piper_marker_perception marker_locator.py \
#         --ros-args --params-file <包>/config/marker_locator_c270.yaml
#
# 换回腕部相机时用 marker_locator_orbbec.yaml，**代码一行都不用改**。
# 相机的全部差异就是这三个数：设备、分辨率、内参文件。

marker_locator:
  ros__parameters:
    # 设备：先试这个路径，不存在就按 device_hint 在 sysfs 里按名字找
    device: "/dev/video2"
    device_hint: "logitech,046d:0825"

    # ⚠️ 640×480 —— 和同事那份标定的分辨率**完全一致**。
    #    内参只在测它的那个分辨率上成立。用 1280×960 跑也能工作
    #    （marker_locator 读回真实分辨率后会按比例换算 fx/fy/主点），
    #    但那多引入一个「两种分辨率覆盖同一视场」的假设，验证阶段没必要。
    #    等有了 1280×960 的标定再调上去，角点精度能翻倍。
    #
    #    C270 最高 1280×960。⚠️ 它做不到 1080p —— 填 1920×1080 会被
    #    静默协商降级到 1280×960，节点会读回来并告警，不会闷声算错。
    width: 640
    height: 480
    fps: 30

    camera_info: "config/camera_info_c270_calibrated.yaml"

    min_markers: 6
    max_reproj_px: 3.0
    min_distance_m: 0.15
    # ⚠️ 暂放宽到 3.0。同事那份内参把距离放大 3.32 倍，板子在量好的 0.5 m 处
    #    会读成 1.66 m —— 上限还留 1.5 的话你只会看到 "no board"，看不到那个
    #    错误的数字，也就没法当场确认焦距错了多少。焦距问题修好后改回 1.5。
    max_distance_m: 3.0

    process_rate_hz: 5.0
    debug_rate_hz: 2.0
