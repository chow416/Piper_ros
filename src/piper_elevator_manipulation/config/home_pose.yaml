# Post-enable home pose for the Piper press task.
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# Enabling the motors does NOT drive the arm to the zero pose. It energises the
# motors and holds whatever pose the arm is already in. A parked, limp arm rests
# against its mechanical stops, and for joint2 and joint3 those stops lie
# *outside* the firmware limits (joint2 is limited to >= 0, joint3 to <= 0).
# Once the firmware takes over it pulls those joints back to the limits, so the
# arm ends up with two joints pinned against their stops.
#
# That is a bad pose to plan from. A five-axis arm asked for a TCP position plus
# a press-axis direction has a family of solutions, and pinning two joints
# removes two degrees of freedom, so nearby targets become unreachable. Measured
# on the real arm, the five-dimensional IK was 4 mm to 11 mm short of the target
# from such a pose, and succeeded as soon as the joints were moved off the stops.
#
# Run `go_home.py` once after enabling the motors so every task starts from a pose
# that is deliberately well away from the stops.
#
# ---------------------------------------------------------------------------
# Joint limits and recommended home ranges
# ---------------------------------------------------------------------------
# Two constraints apply to every value below, and **their numbers are not
# repeated here on purpose** — they live in `go_home.py`'s constants, and a copy
# in a comment goes stale the moment those move.
#
#   * protocol limits — from the arm protocol (`PROTOCOL_LIMITS`). Outside these
#     the pose cannot be commanded at all; `go_home.py` refuses to send it.
#   * recommended home range — the protocol limits pulled back from every stop
#     by a fixed margin (`HOME_MARGIN_RAD`). A pose inside it keeps room to
#     manoeuvre off a stop, and this file should normally stay inside it.
#
# `go_home.py` computes both against the current pose on every run, prints each
# joint with how far it is from the nearest stop, and warns when that is tight.
# `--dry-run` is how you see where a pose stands.
#
# Values in this file are radians, matching the rest of this package.
#
# joint2 and joint3 are the ones that matter. Their zero sits at the end of the
# range, so a home pose at zero puts them straight back onto the stops.
#
# ⚠️ joint2 in this file sits a hair off the stop — far less than the margin
# the arm wants. That is deliberate, not an oversight: this is the pose the
# wrist camera has the calibration board framed from, and lifting joint2 by even
# the recommended margin swings the camera off it, which leaves nothing for
# `marker_locator` to find. `go_home.py` therefore warns about this file on
# every run. The warning is doing its job — it is the reminder that a lift would
# be better if the board can be framed from somewhere else.
#
# The cost of leaving it is bounded rather than fatal: the press was measured
# from this exact pose and solved, landing within a few millimetres of centre.
#
# joint6 is not part of the five-axis press configuration. The driver holds it at
# its measured angle, so there is no home entry for it.
#
# The recommended ranges are advisory: `go_home.py` refuses values outside the
# protocol limits and warns when a value falls outside the recommended range.
#
# ---------------------------------------------------------------------------
# Relationship to the free-motion route
# ---------------------------------------------------------------------------
# config/free_motion_route.yaml drives the task's free-motion segment. Its first
# waypoint should sit close to this home pose so that segment is a short, well
# conditioned hop rather than a detour.

# Recorded from the real arm, in the pose the wrist camera frames the board
# from — see the joint2 note above. Radians, matching the rest of this package.
#
# joint5 follows the board, and it has been moved three times on 2026-09-30 --
# always from a measurement of where the board actually lands in the image,
# never by eye. Figures are in the camera's optical frame; the half field of
# view is 33.9 x 26.7 deg.
#
#   0.6602   board centre 19.93 deg *below* the axis; the bottom row of
#            markers was clipping the frame edge and `marker_locator` kept
#            reporting `no board (need 6 markers)`
#   0.9081   board centred -- worst corner 1.41 deg from the axis against a
#            26.7 deg limit. Detection went to a steady 5.005 Hz and the pose
#            jitter dropped to 0.07/0.34/0.53 mm peak to peak.
#   0.5091   board had moved again. Only IDs 6, 7, 8 decoded, at 30 px from the
#            *top* edge, which puts the centre about 28.6 deg *above* the axis.
#            The wrist is raised to follow it.
#
# The lesson from doing this three times: this number is not a property of the
# robot, it is a property of where the board happens to be standing. Re-measure
# after any move. Note also that the view rotates about 1.25 times as fast as
# joint5 turns -- the camera does not just spin on the wrist axis, it also
# translates, so the two are not 1:1 in practice even though the pitch is.
#
# joint5 is the right knob and joint2 is not. joint2 sits a hair off a stop
# whose limit is >= 0, so its only free direction is *up*, and up swings the
# camera *away* from the board.
#
# ⚠️ Home is also the seed the press plans from. If the press starts failing 5D
# IK from 'captured start state', this is the first thing to revisit.
home_pose:
  # ⚠️ 行尾**不写角度换算，也不写建议区间** —— 那些数会随着这里改值而失效。
  #    约束本身在 `go_home.py` 的 PROTOCOL_LIMITS / HOME_MARGIN_RAD 里，
  #    它每次运行都会逐关节算出「离最近的限位还有多远」并告警，
  #    越界直接拒发。想知道当前区间，跑一次 `--dry-run` 看输出。
  joint1:  0.0000
  joint2:  0.0105   # ⚠️ 刻意低于建议区间下限：为相机视野，见上方说明
  joint3: -0.4215
  joint4:  0.0000
  joint5:  0.5091   # 对准标定板 —— 五个值里唯一随板子实际位置变的
