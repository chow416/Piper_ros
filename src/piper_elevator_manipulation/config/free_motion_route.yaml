# Joint angles are in radians. These are example staging poses for the
# tabletop simulation and must be recalibrated if the robot geometry changes.
# Each segment is checked against the live MoveIt planning scene at runtime.
piper_press_button_demo:
  ros__parameters:
    cartesian:
      max_step_m: 0.002
      max_lateral_error_m: 0.003
      max_joint_jump_rad: 0.20
      # Scalings multiply BOTH the velocity and the acceleration limits in
      # piper_press_moveit/config/joint_limits.yaml (3.0 rad/s, 5.0 rad/s^2),
      # so 0.20 means 0.60 rad/s and 1.00 rad/s^2.
      #
      # They are plain ROS parameters on piper_press_button_demo and are re-read
      # on every press, so a warm node takes a new value on its next press with
      # no rebuild and no restart:
      #   ros2 param set /piper_press_button_demo cartesian.press_speed_scaling 0.04
      # (press must stay <= approach or the task builder rejects the request.)
      #
      # 2026-10-23 speed pass. Times below are estimates from the trapezoidal
      # profile, not measurements -- time them on the real arm before quoting
      # them anywhere.
      #   approach 0.10 -> 0.20   ~90 mm   1.9 s -> 1.1 s
      #   press    0.02 -> 0.06   ~20 mm   1.7 s -> 0.9 s
      #   retreat  rides the approach planner (see below), so it moved with it:
      #            ~110 mm  2.2 s -> 1.2 s
      #
      # The approach still ends `contact_standoff_m` short of the aim and the
      # trajectory terminates there, so nothing about that leg touches the
      # panel more firmly -- it just gets there sooner.
      approach_speed_scaling: 0.20
      # The press is the only phase that touches anything and there is no
      # force sensor. 0.02 was picked when the press travelled 3 mm; it now
      # travels 20 mm (press_params.yaml), so the old "under a second anyway"
      # reasoning no longer holds.
      #
      # ⚠ This is the one change with a physical cost: raising it to 0.06
      # triples the tip speed at contact, roughly 18 -> 54 mm/s. If the button
      # rebounds, the panel is pushed, or the trajectory overshoots, put this
      # back to 0.02 and keep the other two -- they are independent.
      press_speed_scaling: 0.06
      # ⚠ Recovery only. The normal press path reuses the approach planner for
      # its retreat stage (press_task_builder.cpp), so editing this value does
      # NOT change the retreat seen during a normal press -- approach does.
      # Wiring retreat to its own planner is a separate change; until then this
      # keeps the recovery path in step with the approach speed.
      retreat_speed_scaling: 0.20
    press_timeout_s: 15.0
    free_motion:
      route_name: tabletop_staging
      waypoint_names: [clearance]
      max_joint_step_rad: 0.025
      # Corrects only the start-state joint-limit noise that the hardware
      # reports. Measured on the real arm with the motors enabled: joint3 rests
      # at about 0.0025 rad past its zero-side limit because the firmware soft
      # limit and the mechanical stop do not coincide. The simulator only ever
      # showed a few 1e-5 rad, so the tolerance is set from the hardware figure
      # with roughly a factor of two of margin. The validator rejects anything
      # above 0.005 rad, so this cannot be widened into hiding a real fault.
      start_bound_tolerance_rad: 0.005
      # Also used by the OMPL fallback and the return-to-start stage, so this is
      # the single knob for how fast untethered free motion runs.
      velocity_scaling: 0.20
      acceleration_scaling: 0.20
      # J5 was rebased after its vendor mechanical zero was reset. Subtracting
      # the same 0.2705 rad used by home_pose.yaml preserves this waypoint's
      # physical wrist attitude in the new encoder coordinate system.
      clearance:
        joint1: 0.0
        joint2: 0.15
        joint3: -0.15
        joint4: 0.0
        joint5: -0.2705
