# ═════════════════════════════════════════════════════════════════════════════
#  按压参数 —— 要调就调这个文件。
#
#  ⚠️⚠️ **单位是米。全部都是米。**  ROS 的 SI 习惯，不是毫米。
#
#        contact_standoff_m: 0.025    = 25 mm
#        press_depth:        0.0015   = 1.5 mm
#        approach_distance:  0.030    = 30 mm
#
#      三个键里**只有第一个带 `_m` 后缀**，另两个没有 —— 别被这个误导，
#      它们同样是米。而日志里印的是**毫米**（"contact standoff 25.0 mm"），
#      所以“文件里写 0.025、日志说 25.0”是同一件事，不是换算错了。
#
#  改完存盘，**下一次按压就生效**：不用重起服务，不用重新编译，不用重新 launch。
#  节点每次按压前都会重新读它。
#
#  install/ 里那份是**符号链接**指回本文件（colcon --symlink-install），所以编辑
#  这棵树里的文件，就是在编辑运行时真正用的那个文件。
#
#  值有变化时日志会打一行，照它确认生效没有（注意日志印的是**毫米**）：
#      Press parameters (from /ws/.../config/press_params.yaml): approach 30.0 mm,
#      contact standoff 25.0 mm, press depth 1.5 mm
#
#  ⚠️ **本文件优先级最高**：只要它在那儿，launch 参数（比如 press_board.sh 的
#     --standoff / --depth）就不起作用。真被覆盖了日志会有 WARN 明说，
#     不会静默。想回到命令行控制，就把 press_params_file 传成空串。
# ═════════════════════════════════════════════════════════════════════════════

# ── 接近段终点：停在瞄准点之前多远 ──────────────────────────────────────────
# ★ 现在最常调的就是这一个。
#
# 为什么需要它：瞄准点来自标定，标定误差会把瞄准点推进真实表面里，于是"接近"
# 变成了"撞"。留一段 standoff，同样的误差就变成一段**看得见、能量**的缝。
#
# ⚠️ 实测（2026-09-29）：模型算出的杆尖比真实杆尖**靠后一个常数量，约 25 mm**，
#    所以要在 0.025 附近杆尖才差不多停在目标点前面。
#    三种板子姿态下的轴向偏差：-28.0 / -27.8 / -28.2 mm，离散只有 0.4 mm
#    ⇒ 不随姿态变化 ⇒ 是沿杆方向的固定误差（指向压杆长度），不是手眼旋转错。
#
# 单位米。允许 [0, 0.05] m（即 0 ~ 50 mm），且必须小于 approach_distance。
contact_standoff_m: 0.025      # = 25 mm

# ── 按压段行程：从接近终点再往前推多少 ──────────────────────────────────────
# 单位米。允许 (0, 0.015] m（即 0 ~ 15 mm）。想看到明显压痕就加大它；只想碰一下就减小。
press_depth: 0.0015            # = 1.5 mm

# ── 接近段起点：从瞄准点往回退多远开始接近 ──────────────────────────────────
# 单位米。允许 [0.01, 0.15] m（即 10 ~ 150 mm）。一般不用动。
approach_distance: 0.030       # = 30 mm

# ── ⚠️ 关于「干跑 / 实机」── **故意不放在这个文件里** ────────────────────────
#
# `execute` 和 `hardware_enable` 是**动真臂的两道闸门**，它们只能在命令行上、
# 每次跑的时候现敲（tools/demo.sh --live）。不写进本文件是因为：
#
#   一个能活过这次会话的 `execute: true`，正是那个「只差一个马虎的 flag」的
#   隐患 —— 而这个 launch profile 的设计初衷就是要避开它。
#
# 而且如果这两个键在这里，`demo.sh --live` 会被文件静默盖掉（文件说 false，
# --live 就白给了）—— 那比不放还糟。
