# ═════════════════════════════════════════════════════════════════════════════
#  按压参数 —— 要调就调这个文件。
#
#  ⚠️⚠️ **单位是米。全部都是米。**  ROS 的 SI 习惯，不是毫米。
#
#      ★ 读这几个数**别数小数点**，一位一位念：
#
#        0.0015 m =  1.5 mm = 0.15 cm
#        0.015  m =   15 mm =  1.5 cm
#        0.15   m =  150 mm =   15 cm
#
#      它们只差一个小数点，实际差 10 倍。
#      ⇒ **要确认参数到底吃进去没有，看终端横幅或节点日志**（见下），
#        不要看本文件的行尾注释。
#
#      三个键里**只有第一个带 `_m` 后缀**，另两个没有 —— 别被这个误导，
#      它们同样是米。而日志里印的是**毫米**（"contact standoff 25.0 mm"），
#      所以“文件里写 0.025、日志说 25.0”是同一件事，不是换算错了。
#
#  ★ 行尾**不写换算后的数字** —— 历史上这类注释出现过两次“值改了、注释没跟上”。
#     要知道现在到底是多少：看终端横幅或节点日志（它们只读冒号后面那个数，
#     再算成毫米印出来，所以屏幕上那行一定是对的）。
#
#  改完存盘，**下一次按压就生效**：不用重起服务，不用重新编译，不用重新 launch。
#  节点每次按压前都会重新读它。
#
#  install/ 里那份是**符号链接**指回本文件（colcon --symlink-install），所以编辑
#  这棵树里的文件，就是在编辑运行时真正用的那个文件。
#
#  ★ 想确认"现在到底会怎么按"，**看终端**，不要看本文件的行尾注释：
#
#      - demo.sh / press_board.sh --serve 的横幅会把本文件的三个值**算出来**
#        印成毫米（它只读冒号后面那个数，行尾注释怎么写都影响不到它）；
#      - 节点日志也会打一行：
#          Press parameters (from .../press_params.yaml): approach <A> mm,
#          contact standoff <B> mm, press depth <C> mm
#
#    两者印的都是**毫米**，和本文件的米差 1000 倍，是同一件事。
#
#  ⚠️ **本文件优先级最高**：只要它在那儿，**launch 参数**就不起作用。
#     真被覆盖了日志会有 WARN 明说，不会静默。
#     （`--standoff` / `--depth` 这两个命令行参数已经被 tools/press_board.sh
#      直接拒绝掉了；但直接 launch 时传的 `contact_standoff_m:=` 这类
#      参数仍然会被本文件盖掉 —— 那正是下面那条 WARN 在报的事。）
#     想回到命令行控制，就把 press_params_file 传成空串。
# ═════════════════════════════════════════════════════════════════════════════

# ── 接近段终点 = 按压段起点：停在瞄准点之前多远 ──────────────────────────────
# ★ 现在最常调的就是这一个，因为它**同时决定按压段从哪开始、到哪结束**。
#
# 三个点是这么定义的：
#     接近起点 = 瞄准点 − approach_distance
#     按压起点 = 瞄准点 − contact_standoff     ← 接近段停在这里
#     按压终点 = 按压起点 + press_depth         ← 按压段就推这么远
#
# 即：**调 standoff 会把整个按压段一起平移**，而 press_depth 始终是
# "从停下的地方再压进去多少" —— 与标定误差无关。
#
# （早先不是这样：那时按压终点写成 `瞄准点 + press_depth`，于是 standoff 只能
#  移动按压**起点**、动不了终点 —— 无论 standoff 加多大，杆尖都会推过瞄准点。
#  那是个陷阱，已经改掉。）
#
# 为什么需要它：瞄准点来自标定，而实测模型杆尖比真实杆尖**靠后一个常数量**
# （数值见下方「模型误差」一节的实测记录）。这个误差会把瞄准点推进真实表面里，
# 于是"接近"变成"撞"。
# 留一段 standoff，同样的误差就变成一段**看得见、能量**的缝。
#
# 怎么找值：从 0 开始逐步加大，直到杆尖**刚好**停在板面前。那个数就是模型偏差的
# 直接测量 —— 拿它去校正 piper_press_tool.xacro 的 tool_length 才是治本。
#
# 单位米。上限、以及“必须小于 approach_distance”都在 `press_parameters.cpp`
# 里校验，越界会被拒绝并退回 launch 默认值（日志会打 ERROR）。
contact_standoff_m: 0.038

# ── 按压段行程：从接近段停下的地方再往前推多少 ──────────────────────────────
# 单位米。上限很小（在 `press_parameters.cpp` 里校验），超过会被拒绝并退回
# launch 默认值（日志会打 ERROR）。
#    想看到明显压痕就加大它；只想碰一下就减小。
# ⚠️ 这是**真实的穿透量**，与标定误差无关 —— 因为它是从"实际停下的地方"量的。
#
# ⚠️⚠️ **不要小于 `cartesian.max_step_m`**（那个值在 `free_motion_route.yaml` 里）。
#     试过比它更小的值，后果很隐蔽：笛卡尔直线规划器按那个步长采样，
#     按压段比它短就只采出一个点，轨迹凑不满两个路径点，`collectMotions` 把它
#     当空段丢掉 —— 于是 MTC 解里**没有 press 段**。
#     症状不是"少了 press"，而是执行到 "advance to button contact" 之后直接撞上
#     相位校验：
#         MTC solution has an unexpected phase order
#     而那一刻**臂正顶在按键上**，任务却退出了，回不去。规划摘要只打段名不打
#     数量，所以从日志上看不出少了一段。
#     ⇒ 按压段要**明显**长于那个采样步长，别贴着它取。
press_depth: 0.030          # 很轻，只碰一下

# ── 接近段起点：从瞄准点往回退多远开始接近 ──────────────────────────────────
# 单位米。上下限都在 `press_parameters.cpp` 里校验。一般不用动
# （本设计要动它的上限，见 specs）。
approach_distance: 0.100

# ═════════════════════════════════════════════════════════════════════════════
#  接近位姿的第二次观测（精修正）
# ═════════════════════════════════════════════════════════════════════════════
#
# 臂停在接近位姿时会再拍一次（按键旁那个单码），用它修正粗目标。
# 只融合**位置**；法向仍用第一次的 —— 单码只有 4 个共面角点，撑不起法向。
#
# ★ 任何一步出问题都会**退回用粗目标**继续按：视觉是增益项，不是依赖项。
#   所以改这里的值不会有"整个按压跑不起来"的风险，最坏也只是白跑一趟。
#
# ★ 是否真的生效，看节点日志里这一行：
#       Refine round 1/1: dP=xx.x mm, dtheta=x.xx deg, weight 0.50 -> aim moves x.x mm
#   只出现 "keeping the coarse target (...)" 而**没有**上面那行 = 没生效。
#   这不是小事：阈值设得太紧时，功能看着在跑、其实永远退回粗目标，**静默失效**。

# 修正轮数。**这里写 0 就关掉**；不写这个键就跟随 launch 参数
# （和上面三个键一样的规矩：**本文件优先级最高**）。
# 本版本结构上支持多轮，但只做一轮。
max_refinement_rounds: 1

# 等精目标的超时，秒。**必须大于 0**。
# ⚠️ 写 0 不是"跳过观测"，而是"要求消息在同一瞬间到达" —— 那就是按压永远不开始。
#    视觉坏了应该是"少修一点"，不该是"任务卡死"。
refine_wait_timeout_s: 2.0

# 精目标的权重 w ∈ [0, 1]：新瞄准点 = (1−w)·粗目标 + w·精目标。
#
# ⚠️ **别凭感觉往上调。** "第二次更准"这个前提从没被证实过：
#   单码角点少、基线短，抖动本来就比整板大。这个权重压在**一个没有冗余的观测**
#   上，调高它的代价是静默的。
#   怎么定：看日志里 `Refine round` 那行的 dP，跑几次比散布 —— dP 是两次观测对
#   **同一个按键**的分歧，它小到几毫米才说明第二次确实更准。
refine_fusion_weight: 0.5

# |精目标 − 粗目标| 超过这个距离（米）就**整个拒绝**第二次观测。
# 这是单码方案的**主要安全闸**：码贴反 / 解飞会稳定地给出一个错位姿，
# 而它的重投影误差反而更小，只能靠这道闸拦。
refine_max_correction_m: 0.050

# 两次法向的夹角超过这个角度（度）就判精目标解飞了，整个第二次作废。
# ⚠️ 法向**不参与融合**，这道闸只是"健康度信号"。
#    设太紧 = 看着在跑、其实永远退回粗目标（**静默失效**）——
#    实测单码法向的抖动范围相当宽，往下调很容易踩到。
refine_max_angle_deg: 30.0

# ── 关于压杆长度的那个模型误差（背景，不是要你改的东西）───────────────────
# 实测（2026-09-29）：三种板子姿态下，模型杆尖与真实杆尖的轴向差：
#      -28.0 / -27.8 / -28.2 mm      离散只有 0.4 mm
#   ⇒ **不随板子姿态变化** ⇒ 是沿杆方向的固定误差，不是手眼旋转错
#   ⇒ 指向压杆长度。历史上就有过一次同类修正：135.8 → 154.1 mm（差 18.3 mm）。
#
# 治法：用上面那个"从 0 开始加大 standoff"的办法量出真实差值，
# 去改 piper_description/urdf/piper_press_tool.xacro 的 tool_length（唯一来源，
# ros2_control / MoveIt / Gazebo 都读它）。改对之后 standoff 可以退回几毫米。
# ── ⚠️ 关于「干跑 / 实机」── **故意不放在这个文件里** ────────────────────────#
# `execute` 和 `hardware_enable` 是**动真臂的两道闸门**，它们只能在命令行上、
# 每次跑的时候现敲（tools/demo.sh --live）。不写进本文件是因为：
#
#   一个能活过这次会话的 `execute: true`，正是那个「只差一个马虎的 flag」的
#   隐患 —— 而这个 launch profile 的设计初衷就是要避开它。
#
# 而且如果这两个键在这里，`demo.sh --live` 会被文件静默盖掉（文件说 false，
# --live 就白给了）—— 那比不放还糟。
